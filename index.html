<header>
  <h1>Blur samples</h1>
  <p>One photograph from 2.0.1 Essential Elements. Drag the oval onto a face. Change the method and the strength. Nothing here is the page.</p>
</header>

const img=new Image();
const c=document.getElementById("c");
const ctx=c.getContext("2d");
let method="gaussian", strength=24, radiusPct=14;
let cx=0.78, cy=0.22, down=false, hold=false;
const buttons=[...document.querySelectorAll("button")];
buttons.forEach(b=>b.onclick=()=>{method=b.dataset.m; buttons.forEach(x=>x.classList.toggle("on",x===b)); draw()});
document.getElementById("strength").oninput=e=>{strength=+e.target.value; document.getElementById("sv").textContent=strength; draw()};
document.getElementById("radius").oninput=e=>{radiusPct=+e.target.value; document.getElementById("rv").textContent=radiusPct; draw()};
function pos(e){const r=c.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height; return [x,y]}
c.onpointerdown=e=>{hold=true; down=true; const [x,y]=pos(e); cx=x; cy=y; draw()};
c.onpointermove=e=>{if(!down) return; const [x,y]=pos(e); cx=x; cy=y; draw()};
window.onpointerup=()=>{down=false; hold=false; draw()};
function draw(){
  const w=img.width, h=img.height; c.width=w; c.height=h;
  ctx.drawImage(img,0,0);
  if(hold&&down) return;
  const rx=w*radiusPct/100, ry=rx*1.15, x=cx*w, y=cy*h;
  if(method==="disc"){ctx.fillStyle="#f5eee3"; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fill(); return}
  if(method==="bar"){ctx.fillStyle="#f5eee3"; ctx.fillRect(x-rx, y-ry*0.25, rx*2, ry*0.5); return}
  const off=document.createElement("canvas"); off.width=w; off.height=h; const o=off.getContext("2d");
  o.drawImage(img,0,0);
  if(method==="pixel"){const s=Math.max(6, Math.round(strength/2)); o.drawImage(off,0,0,w/s,h/s); o.imageSmoothingEnabled=false; o.drawImage(off,0,0,w/s,h/s,0,0,w,h)}
  else {o.filter="blur("+strength+"px)"; o.drawImage(img,0,0); o.filter="none"}
  ctx.save(); ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.clip(); ctx.drawImage(off,0,0); ctx.restore();
}
img.onload=draw; img.src=SRC;
</script>
